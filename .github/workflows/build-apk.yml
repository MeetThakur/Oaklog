name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs the SDK command-line tools and accepts licenses so Gradle can fetch compileSdk 36.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Caches Gradle dependencies and the wrapper distribution between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      # The APK is a build of the app's source, so only publish it where access is restricted.
      # In a public repository anyone could download it, so the step is skipped there.
      - name: Upload debug APK
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: oaklog-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
