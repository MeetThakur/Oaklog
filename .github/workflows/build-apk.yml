name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already has the Android SDK. Accepting its licenses lets Gradle download the
      # compileSdk 36 platform on demand. (android-actions/setup-android failed on a removed "tools" package.)
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      # Caches Gradle dependencies and the wrapper distribution between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oaklog-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
